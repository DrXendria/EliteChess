name: Build & Release Elite Chess

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          python -m PyInstaller --clean --noconsole --onefile --name "Elite_Chess_Manager" --icon "resources/logo.ico" --paths . --add-data "resources;resources" main.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/Elite_Chess_Manager.exe

  build-linux:
    name: Build Linux (.rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compile Linux Binary & RPM
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/rpm/*.rpm

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release-assets/

      - name: Download Linux RPM Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-rpm
          path: release-assets/

      - name: Create Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
